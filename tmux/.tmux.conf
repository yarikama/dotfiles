unbind r
bind r source-file ~/.tmux.conf \; display "Tmux Reloaded!"

set -g prefix C-a
set -g mouse on
set -g default-terminal "tmux-256color"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Catppuccin has to be loaded here rather than left to tpm at the bottom of the
# file. The `set -agF` lines below expand @catppuccin_status_* at assignment
# time, so the modules must already exist or they append an empty string and the
# status line silently loses them. Guarded so a machine that has not run tpm yet
# still starts.
if-shell '[ -f ~/.tmux/plugins/tmux/catppuccin.tmux ]' \
  'run ~/.tmux/plugins/tmux/catppuccin.tmux'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
# set -g status-right "#{E:@catppuccin_status_application}"
set -g status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# tmux-cpu and tmux-battery rewrite the #{battery_*} / #{cpu_*} placeholders in
# the status line when they load, so tpm must run after it is composed.
run '~/.tmux/plugins/tpm/tpm'
