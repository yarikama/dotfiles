unbind r
bind r source-file ~/.tmux.conf \; display "Tmux Reloaded!"

set -g prefix C-a
set -g mouse on
set -g default-terminal "tmux-256color"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Hex colours below need truecolor; Ghostty supports it, tmux just has to be told.
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'

# --- Monokai Pro ---
# Hand-written to match Ghostty's Monokai Pro theme (it replaced the catppuccin
# plugin). Rounded pills use the Nerd Font half-circle glyphs U+E0B6 / U+E0B4.
#   bg #2d2a2e  surface #403e41  dim #727072  text #fcfcfa  muted #939293
#   red #ff6188  orange #fc9867  yellow #ffd866  green #a9dc76  cyan #78dce8  purple #ab9df2

# Transparent status bar, so Ghostty's background-opacity shows through.
set -g status-style 'bg=default,fg=#939293'
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""

set -g window-status-separator " "
set -g window-status-format "#[fg=#403e41,bg=default]#[fg=#939293,bg=#403e41]#I #W#[fg=#403e41,bg=default]"
set -g window-status-current-format "#[fg=#ffd866,bg=default]#[fg=#2d2a2e,bg=#ffd866,bold]#I #W#{?window_zoomed_flag, 󰁌,}#[fg=#ffd866,bg=default,nobold]"

# Right side: session, then battery (tmux-battery fills in the #{battery_*}
# fields). The battery pill is only added where there is a battery, so servers
# and desktops don't show an empty one. Checks macOS first, then Linux sysfs.
set -g status-right "#[fg=#a9dc76,bg=default]#[fg=#2d2a2e,bg=#a9dc76,bold] #S#[fg=#a9dc76,bg=default,nobold]"
if-shell 'pmset -g batt 2>/dev/null | grep -q InternalBattery || ls /sys/class/power_supply/BAT* >/dev/null 2>&1' \
  "set -ag status-right ' #[fg=#ab9df2,bg=default]#[fg=#2d2a2e,bg=#ab9df2]#{battery_icon} #{battery_percentage}#[fg=#ab9df2,bg=default]'"

set -g pane-border-style 'fg=#403e41'
set -g pane-active-border-style 'fg=#ffd866'
set -g message-style 'bg=#403e41,fg=#fcfcfa'
set -g message-command-style 'bg=#403e41,fg=#ffd866'
set -g mode-style 'bg=#5b595c,fg=#fcfcfa'
set -g clock-mode-colour '#ffd866'

# tmux-cpu and tmux-battery rewrite the #{battery_*} / #{cpu_*} placeholders in
# the status line when they load, so tpm must run after it is composed.
run '~/.tmux/plugins/tpm/tpm'
